name: Build from profile
run-name: "Build profile: ${{ inputs.profile }}${{ inputs.kernelsu_variant_override != '(profile default)' && format(' [variant: {0}]', inputs.kernelsu_variant_override) || '' }}${{ inputs.use_kpm_override != '(profile default)' && format(' [KPM: {0}]', inputs.use_kpm_override) || '' }}"

# Builds exactly ONE kernel target from a named profile file in
# config/profiles/, instead of the hardcoded 20-sublevel matrix that
# kernel-a13-5-15.yml (and the other kernel-aNN-*.yml workflows) run.
# See docs/BUILD_PROFILES.md for what a profile is and how to add one.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile name (a file at config/profiles/<name>.yml) — supplies every default below"
        required: true
        type: choice
        options:
          - exia-206
          - bakasu-default
        default: exia-206

      # ==================== Per-run overrides (optional) ====================
      # Leave these on "(profile default)" to use exactly what the profile
      # file says. Pick anything else to override just that one setting for
      # this run only — the profile file itself is never modified. Same
      # options as kernel-a13-5-15.yml's dispatch form; see docs/VARIANTS.md
      # for what each KernelSU variant actually supports.
      kernelsu_variant_override:
        description: "KernelSU variant — see docs/VARIANTS.md. SukiSU=KPM focus+single manager; BakaSU=metamodules+multi-manager, KPM unverified; Official=no KPM"
        required: false
        type: choice
        options:
          - "(profile default)"
          - Official
          - SukiSU
          - "SukiSU(40726)"
          - "SukiSU(40548)"
          - BakaSU
        default: "(profile default)"
      use_kpm_override:
        description: "KPM feature override. Not available for Official; attempted for SukiSU*/BakaSU/Next but fails the build if that variant's source doesn't declare CONFIG_KPM that day"
        required: false
        type: choice
        options:
          - "(profile default)"
          - "disabled"
          - "enabled"
          - "patched (not yet supported)"
        default: "(profile default)"
      use_zram_override:
        description: "ZRAM LZ4KD algorithm override"
        required: false
        type: choice
        options: ["(profile default)", "true", "false"]
        default: "(profile default)"
      use_bbg_override:
        description: "BBG anti-bootloop patch override"
        required: false
        type: choice
        options: ["(profile default)", "true", "false"]
        default: "(profile default)"
      cve_2026_43499_patch_override:
        description: "GhostLock (CVE-2026-43499/CVE-2026-53163) security fix override — see docs/advanced-features-en.md"
        required: false
        type: choice
        options: ["(profile default)", "true", "false"]
        default: "(profile default)"

permissions:
  contents: write
  actions: write

jobs:
  load-profile:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.read.outputs.android_version }}
      kernel_version: ${{ steps.read.outputs.kernel_version }}
      sub_level: ${{ steps.read.outputs.sub_level }}
      os_patch_level: ${{ steps.read.outputs.os_patch_level }}
      source_ref: ${{ steps.read.outputs.source_ref }}
      kernelsu_variant: ${{ steps.read.outputs.kernelsu_variant }}
      ksu_mode: ${{ steps.read.outputs.ksu_mode }}
      enable_susfs: ${{ steps.read.outputs.enable_susfs }}
      use_kpm: ${{ steps.read.outputs.use_kpm }}
      use_zram: ${{ steps.read.outputs.use_zram }}
      use_bbg: ${{ steps.read.outputs.use_bbg }}
      use_rekernel: ${{ steps.read.outputs.use_rekernel }}
      use_nomount: ${{ steps.read.outputs.use_nomount }}
      use_networking: ${{ steps.read.outputs.use_networking }}
      cve_2026_43499_patch: ${{ steps.read.outputs.cve_2026_43499_patch }}
      droidspaces: ${{ steps.read.outputs.droidspaces }}
      droidspaces_ntsync: ${{ steps.read.outputs.droidspaces_ntsync }}
      version: ${{ steps.read.outputs.version }}
      build_time: ${{ steps.read.outputs.build_time }}
      artifact_upload_mode: ${{ steps.read.outputs.artifact_upload_mode }}
      stock_defconfig: ${{ steps.read.outputs.stock_defconfig }}
    steps:
      - uses: actions/checkout@v7

      - name: Read profile
        id: read
        run: |
          set -euo pipefail
          PROFILE_FILE="config/profiles/${{ inputs.profile }}.yml"
          if [ ! -f "$PROFILE_FILE" ]; then
            echo "::error::No such profile file: $PROFILE_FILE"
            exit 1
          fi
          echo "Using profile: $PROFILE_FILE"
          cat "$PROFILE_FILE"

          # plain key=value lines, '#' comments and blank lines ignored,
          # value may contain '=' so only split on the first one.
          get() {
            grep -E "^$1=" "$PROFILE_FILE" | head -n1 | cut -d'=' -f2- || true
          }

          # apply a per-run override on top of the profile's value, unless
          # the override was left on the sentinel "(profile default)".
          override() {
            local profile_value="$1" override_value="$2"
            if [ -n "$override_value" ] && [ "$override_value" != "(profile default)" ]; then
              printf '%s' "$override_value"
            else
              printf '%s' "$profile_value"
            fi
          }

          KERNELSU_VARIANT="$(override "$(get kernelsu_variant)" "${{ inputs.kernelsu_variant_override }}")"
          USE_KPM="$(override "$(get use_kpm)" "${{ inputs.use_kpm_override }}")"
          USE_ZRAM="$(override "$(get use_zram)" "${{ inputs.use_zram_override }}")"
          USE_BBG="$(override "$(get use_bbg)" "${{ inputs.use_bbg_override }}")"
          CVE_PATCH="$(override "$(get cve_2026_43499_patch)" "${{ inputs.cve_2026_43499_patch_override }}")"

          [ "$KERNELSU_VARIANT" != "$(get kernelsu_variant)" ] && echo "Override: kernelsu_variant -> $KERNELSU_VARIANT"
          [ "$USE_KPM" != "$(get use_kpm)" ] && echo "Override: use_kpm -> $USE_KPM"
          [ "$USE_ZRAM" != "$(get use_zram)" ] && echo "Override: use_zram -> $USE_ZRAM"
          [ "$USE_BBG" != "$(get use_bbg)" ] && echo "Override: use_bbg -> $USE_BBG"
          [ "$CVE_PATCH" != "$(get cve_2026_43499_patch)" ] && echo "Override: cve_2026_43499_patch -> $CVE_PATCH"
          true

          {
            echo "android_version=$(get android_version)"
            echo "kernel_version=$(get kernel_version)"
            echo "sub_level=$(get sub_level)"
            echo "os_patch_level=$(get os_patch_level)"
            echo "source_ref=$(get source_ref)"
            echo "kernelsu_variant=$KERNELSU_VARIANT"
            echo "ksu_mode=$(get ksu_mode)"
            echo "use_kpm=$USE_KPM"
            echo "use_zram=$USE_ZRAM"
            echo "use_bbg=$USE_BBG"
            echo "use_rekernel=$(get use_rekernel)"
            echo "use_nomount=$(get use_nomount)"
            echo "use_networking=$(get use_networking)"
            echo "cve_2026_43499_patch=$CVE_PATCH"
            echo "droidspaces=$(get droidspaces)"
            echo "droidspaces_ntsync=$(get droidspaces_ntsync)"
            echo "version=$(get version)"
            echo "build_time=$(get build_time)"
            echo "artifact_upload_mode=$(get artifact_upload_mode)"
            echo "stock_defconfig=$(get stock_defconfig)"
          } >> "$GITHUB_OUTPUT"

          # mirrors the enable_susfs derivation kernel-a13-5-15.yml etc. do
          # from ksu_mode, since this workflow calls build.yml directly.
          KSU_MODE="$(get ksu_mode)"
          if [ "$KSU_MODE" == "SUSFS disabled" ] || [ "$KSU_MODE" == "KSU disabled" ]; then
            echo "enable_susfs=false" >> "$GITHUB_OUTPUT"
          else
            echo "enable_susfs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross-check sub_level against the maintained version data
        # kernel-custom.yml resolves sub_level by looking up os_patch_level in
        # data/<android_version>/<kernel_version>.json (kept current by the
        # scheduled "chore: update GKI kernel version data" commits) instead
        # of a hand-maintained value in the profile file. Profiles still
        # declare sub_level explicitly (needed for source_ref precision --
        # see docs/BUILD_PROFILES.md), but this warns loudly if that drifts
        # from what the maintained data now says, instead of silently
        # building a stale sublevel.
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          android_version = "${{ steps.read.outputs.android_version }}"
          kernel_version = "${{ steps.read.outputs.kernel_version }}"
          os_patch_level = "${{ steps.read.outputs.os_patch_level }}"
          declared_sub_level = "${{ steps.read.outputs.sub_level }}"

          data_path = Path("data") / android_version / f"{kernel_version}.json"
          if not data_path.exists():
              print(f"::warning::No version data at {data_path}, skipping cross-check")
              raise SystemExit(0)

          data = json.loads(data_path.read_text())
          if os_patch_level == "lts":
              expected = data.get("lts")
              expected_sub = expected.rsplit(".", 1)[-1] if expected else None
          else:
              matched = next((e for e in data.get("entries", []) if e.get("date") == os_patch_level), None)
              expected_sub = matched.get("kernel", "").rsplit(".", 1)[-1] if matched else None

          if expected_sub is None:
              print(f"::warning::No maintained data entry for {android_version}/{kernel_version} os_patch_level={os_patch_level}, can't cross-check sub_level={declared_sub_level}")
          elif expected_sub != declared_sub_level:
              print(f"::warning::Profile declares sub_level={declared_sub_level} but maintained data now says {expected_sub} for os_patch_level={os_patch_level} -- the profile may be stale, double check before relying on this build")
          else:
              print(f"Cross-check OK: sub_level={declared_sub_level} matches maintained data for os_patch_level={os_patch_level}")
          PY

      - name: Install this profile's stock_defconfig
        if: steps.read.outputs.stock_defconfig != ''
        run: |
          SRC="${{ steps.read.outputs.stock_defconfig }}"
          if [ ! -f "$SRC" ]; then
            echo "::warning::Profile references stock_defconfig=$SRC but that file doesn't exist, skipping"
            exit 0
          fi
          if [ "$SRC" != "config/stock_defconfig" ]; then
            cp "$SRC" config/stock_defconfig
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/stock_defconfig
            if ! git diff --cached --quiet; then
              git commit -m "ci: install ${{ inputs.profile }}'s stock_defconfig for this build"
              git push
            fi
          fi

  build:
    needs: load-profile
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.load-profile.outputs.android_version }}
      kernel_version: ${{ needs.load-profile.outputs.kernel_version }}
      sub_level: ${{ needs.load-profile.outputs.sub_level }}
      os_patch_level: ${{ needs.load-profile.outputs.os_patch_level }}
      source_ref: ${{ needs.load-profile.outputs.source_ref }}
      ksu_variant: ${{ needs.load-profile.outputs.kernelsu_variant }}
      ksu_mode: ${{ needs.load-profile.outputs.ksu_mode }}
      enable_susfs: ${{ needs.load-profile.outputs.enable_susfs == 'true' }}
      use_kpm: ${{ needs.load-profile.outputs.use_kpm }}
      use_zram: ${{ needs.load-profile.outputs.use_zram == 'true' }}
      use_bbg: ${{ needs.load-profile.outputs.use_bbg == 'true' }}
      use_rekernel: ${{ needs.load-profile.outputs.use_rekernel == 'true' }}
      use_nomount: ${{ needs.load-profile.outputs.use_nomount == 'true' }}
      use_networking: ${{ needs.load-profile.outputs.use_networking == 'true' }}
      cve_2026_43499_patch: ${{ needs.load-profile.outputs.cve_2026_43499_patch == 'true' }}
      droidspaces: ${{ needs.load-profile.outputs.droidspaces }}
      droidspaces_ntsync: ${{ needs.load-profile.outputs.droidspaces_ntsync == 'true' }}
      version: ${{ needs.load-profile.outputs.version }}
      build_time: ${{ needs.load-profile.outputs.build_time }}
      artifact_upload_mode: ${{ needs.load-profile.outputs.artifact_upload_mode }}
