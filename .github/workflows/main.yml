# GKI kernel build main entry
# This workflow is the project's unified entry point, used to:
# 1. Build all versions of the GKI kernel
# 2. Fetch the latest KSU manager
# 3. Collect patch conflict files and compile failure logs for debugging
# 4. Create a GitHub Release (optional)

name: Build kernels

# Concurrency control: only one instance per branch runs; a new run cancels the old one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Dropdown options ====================
      release_type:
        description: "Release type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions
      kernelsu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
          - Official
          #- Next
        default: ReSukiSU
      ksu_mode:
        description: "KernelSU / SUSFS mode"
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM feature (patched not yet supported)"
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces container support (5.10~6.6: slot patch, 6.12: on/off)"
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"

      # ==================== Text inputs ====================
      version:
        description: "Custom version name (optional)"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom build time (optional, N or empty = current UTC)"
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
        required: false

      # ==================== Toggles (default on) ====================
      build_all:
        description: "Build all versions"
        type: boolean
        default: true
      export_susfs_patches:
        description: "Collect SUSFS integration patches (SukiSU / ReSukiSU only)"
        type: boolean
        default: true

      # ==================== Toggles (default off) ====================
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      use_zram:
        description: "Enable ZRAM enhanced algorithms"
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG anti-brick"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        type: boolean
        default: false
      use_nomount:
        description: "Enable NoMount mount meta-module"
        type: boolean
        default: false
      use_networking:
        description: "Enable network enhancements (BBRv3 / IPSet / Qdisc / CIFS)"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix chain"
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "Enable Droidspaces container NTSync support (requires Droidspaces enabled)"
        type: boolean
        default: false

jobs:
  # Download the latest KernelSU manager APK and SUSFS module
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

  build-a12-5-10:
    if: inputs.build_a12_5_10 || inputs.build_all
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  build-a13-5-15:
    if: inputs.build_a13_5_15 || inputs.build_all
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  build-a14-6-1:
    if: inputs.build_a14_6_1 || inputs.build_all
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  build-a15-6-6:
    if: inputs.build_a15_6_6 || inputs.build_all
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  build-a16-6-12:
    if: inputs.build_a16_6_12 || inputs.build_all
    uses: ./.github/workflows/kernel-a16-6-12.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_nomount: ${{ inputs.use_nomount }}
      use_networking: ${{ inputs.use_networking }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      ksu_mode: ${{ inputs.ksu_mode }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "上传全部"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  # Aggregate all .rej files from every build job for easier patch debugging
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download conflict files
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: Process conflict files
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: Upload aggregated conflict files
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # Aggregate all failure logs by build name for unified download and triage
  collect-build-logs:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download compile failure logs
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-build-logs
          pattern: '*-Build-Logs'
          merge-multiple: false

      - name: Process compile failure logs
        run: |
          mkdir -p aio-build-logs
          found_logs=false
          for dir in ./downloaded-build-logs/*-Build-Logs; do
            [ -d "$dir" ] || continue
            artifact_name=$(basename "$dir")
            mkdir -p "aio-build-logs/$artifact_name"
            cp -r "$dir/." "aio-build-logs/$artifact_name/"
            found_logs=true
          done

          # download-artifact extracts straight to the target dir when it matches only one artifact
          if [ "$found_logs" = false ] && [ -f ./downloaded-build-logs/artifact-name.txt ]; then
            read -r artifact_name < ./downloaded-build-logs/artifact-name.txt
            artifact_name=$(basename "$artifact_name")
            if [ -n "$artifact_name" ]; then
              mkdir -p "aio-build-logs/$artifact_name"
              cp -r ./downloaded-build-logs/. "aio-build-logs/$artifact_name/"
            fi
          fi

          if [ "$(ls -A aio-build-logs 2>/dev/null)" ]; then
            cd aio-build-logs
            zip -r -q -9 ../AIO-BUILD-LOGS.zip .
          fi

      - name: Upload aggregated compile failure logs
        id: upload_aggregated_build_logs
        uses: actions/upload-artifact@v6
        with:
          name: AIO-BUILD-LOGS
          path: AIO-BUILD-LOGS.zip
          if-no-files-found: ignore

      - name: Delete standalone compile failure logs
        if: steps.upload_aggregated_build_logs.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # After the aggregated artifact uploads successfully, delete the intermediate artifacts to avoid duplicate storage
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | endswith("-Build-Logs")) | .id'); then
            echo "::warning::Failed to list standalone compile failure logs, skipping cleanup"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "Deleted intermediate log artifact: $artifact_id"
            else
              echo "::warning::Failed to delete intermediate log artifact $artifact_id"
            fi
          done <<< "$ARTIFACT_IDS"

  # Aggregate the SUSFS integration patches exported by each build job into one zip for the Release
  # Artifacts only exist for SukiSU / ReSukiSU with SUSFS enabled
  collect-susfs-patches:
    if: ${{ !cancelled() && inputs.export_susfs_patches && inputs.ksu_mode == '关闭' && (inputs.kernelsu_variant == 'SukiSU' || inputs.kernelsu_variant == 'ReSukiSU') }}
    runs-on: ubuntu-24.04
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download SUSFS integration patches
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-susfs-patches
          pattern: 'SUSFS-Patch-*'
          merge-multiple: false

      - name: Organize SUSFS integration patches
        env:
          KSU_VARIANT: ${{ inputs.kernelsu_variant }}
        run: |
          BUNDLE="susfs-patches"
          mkdir -p "$BUNDLE"
          found=0

          # Archive by the fields in the manifest: android14-6.1/6.1.148-2025-12/
          place_patch() {
            local src="$1" manifest="$src/manifest.json"
            if [ ! -f "$manifest" ] || [ ! -s "$src/susfs.patch" ]; then
              echo "::warning::$src is missing manifest.json or susfs.patch, skipping"
              return 0
            fi
            local android_version kernel_version actual_sublevel os_patch_level
            android_version=$(jq -r '.android_version' "$manifest")
            kernel_version=$(jq -r '.kernel_version' "$manifest")
            actual_sublevel=$(jq -r '.actual_sublevel' "$manifest")
            os_patch_level=$(jq -r '.os_patch_level' "$manifest")
            local dest="$BUNDLE/${android_version}-${kernel_version}/${kernel_version}.${actual_sublevel}-${os_patch_level}"
            mkdir -p "$dest"
            cp "$src/susfs.patch" "$src/manifest.json" "$dest/"
            [ -f "$src/susfs.config" ] && cp "$src/susfs.config" "$dest/"
            found=$((found + 1))
          }

          for dir in ./downloaded-susfs-patches/SUSFS-Patch-*; do
            [ -d "$dir" ] || continue
            place_patch "$dir"
          done
          # download-artifact extracts straight to the target dir when it matches only one artifact
          if [ "$found" -eq 0 ] && [ -f ./downloaded-susfs-patches/manifest.json ]; then
            place_patch ./downloaded-susfs-patches
          fi

          if [ "$found" -eq 0 ]; then
            echo "::warning::No SUSFS integration patches to aggregate"
            exit 0
          fi
          echo "Aggregated $found patches in total"

          # Top-level index: merge all manifests, sorted by kernel version
          find "$BUNDLE" -name manifest.json -print0 | sort -z | xargs -0 jq -s \
            --arg ksu_variant "$KSU_VARIANT" \
            --arg generated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              ksu_variant: $ksu_variant,
              generated_at: $generated_at,
              run_id: $run_id,
              run_url: $run_url,
              count: length,
              patches: (map(. + {
                path: ("\(.android_version)-\(.kernel_version)/\(.kernel_version).\(.actual_sublevel)-\(.os_patch_level)/")
              }) | sort_by(.android_version, (.actual_sublevel | tonumber)))
            }' > "$BUNDLE/index.json"

          cat > "$BUNDLE/README.md" << 'EOF'
          # SUSFS integration patches

          This archive is exported automatically by the GKI_KernelSU_SUSFS build pipeline; each directory corresponds to a GKI branch,
          the content is the full diff of `common/` between the two points "after adding KernelSU" and "after applying the SUSFS patch",
          and already includes the context fixes this branch needs, with the corresponding kernel verified to compile.

          Directory structure: `<android version>-<kernel version>/<kernel version>.<sublevel>-<security patch level>/`

          | File | Description |
          |:---|:---|
          | `susfs.patch` | SUSFS kernel-side patch (`git diff --binary` format) |
          | `susfs.config` | SUSFS config fragment to append to the defconfig |
          | `manifest.json` | build info: GKI branch & commit, KernelSU commit, SUSFS commit, .rej count, etc. |
          | `index.json` | top-level index aggregating all manifests |

          ## Usage steps

          1. Confirm that `VERSION`, `PATCHLEVEL`, `SUBLEVEL` in the kernel source `Makefile` match the directory name;
             if they do not match, try the closest sublevel first.
          2. In the directory above the kernel source (the parent of `common/`), run `ksu_setup_cmd` from `manifest.json`,
             adding KernelSU at the recorded commit hash. The patch content matches that KernelSU commit; do not switch to another branch.
          3. Enter `common/` and apply the patch:

             ```bash
             git apply -3 /path/to/susfs.patch
             # Fallback when the source is not a git repo:
             patch -p1 < /path/to/susfs.patch
             ```

          4. Append `susfs.config` to the defconfig (for GKI, `arch/arm64/configs/gki_defconfig`):

             ```bash
             cat /path/to/susfs.config >> arch/arm64/configs/gki_defconfig
             ```

          5. Enable `CONFIG_KSU` and related options per the KernelSU docs, then build normally.

          ## Notes

          - The patches are verified on pure GKI source. GKI-based OEM kernels may produce `.rej` because dirs like fs/, security/ are modified,
            requiring manual merge. `git apply -3` three-way merge resolves most context offsets automatically.
          - When pinning a KernelSU commit, KernelSU's own version number and string are computed by its Kbuild at build time and may show as the branch's latest count or `@HEAD`; this is upstream behavior.
          - Using a KernelSU commit different from `ksu_commit` in `manifest.json` usually still compiles, but full functionality is not guaranteed.
          EOF

          cd "$BUNDLE"
          zip -r -q -9 "../SUSFS-Patches-${KSU_VARIANT}.zip" .
          cd ..
          echo "SUSFS_PATCHES_ZIP=SUSFS-Patches-${KSU_VARIANT}.zip" >> $GITHUB_ENV

      - name: Upload aggregated SUSFS integration patches
        id: upload_aggregated_susfs_patches
        if: env.SUSFS_PATCHES_ZIP != ''
        uses: actions/upload-artifact@v6
        with:
          name: SUSFS-Patches-${{ inputs.kernelsu_variant }}
          path: ${{ env.SUSFS_PATCHES_ZIP }}
          if-no-files-found: ignore

      - name: Delete standalone SUSFS patch artifacts
        if: steps.upload_aggregated_susfs_patches.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # After the aggregated artifact uploads successfully, delete the intermediate artifacts to avoid duplicate storage
          if ! ARTIFACT_IDS=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("SUSFS-Patch-")) | .id'); then
            echo "::warning::Failed to list standalone SUSFS patch artifacts, skipping cleanup"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            if gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > /dev/null; then
              echo "Deleted intermediate patch artifact: $artifact_id"
            else
              echo "::warning::Failed to delete intermediate patch artifact $artifact_id"
            fi
          done <<< "$ARTIFACT_IDS"

  # When release_type is not Actions, create a GitHub Release
  # Runs only on the origin repo; forks skip this step
  release:
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' && github.repository == 'zzh20188/GKI_KernelSU_SUSFS' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    needs:
      - get-manager
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - collect-susfs-patches

    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Set display names
        run: |
          # KSU display name
          case "${{ inputs.kernelsu_variant }}" in
            "Next")      KSU_NAME="KernelSU-Next" ;;
            "Official")  KSU_NAME="KernelSU" ;;
            "SukiSU")    KSU_NAME="SukiSU" ;;
            "ReSukiSU")  KSU_NAME="ReSukiSU" ;;
          esac
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV

          # Version info
          KSU_VER="${{ needs.get-manager.outputs.ksuVer }}"
          SUS_VER="${{ needs.get-manager.outputs.susVer }}"
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "SUS_VER=$SUS_VER" >> $GITHUB_ENV

          # Feature toggle display
          echo "LZ4_STATUS=${{ inputs.use_zram && 'on' || 'off' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && 'Supported' || 'Not supported' }}" >> $GITHUB_ENV
          echo "NET_STATUS=${{ inputs.use_networking && 'on' || 'off' }}" >> $GITHUB_ENV
          if [[ "${{ inputs.use_kpm }}" == enabled* ]]; then
            echo "KPM_STATUS=Supported" >> $GITHUB_ENV
          elif [[ "${{ inputs.use_kpm }}" == patched* ]]; then
            echo "KPM_STATUS=Supported (patch not yet supported)" >> $GITHUB_ENV
          else
            echo "KPM_STATUS=off" >> $GITHUB_ENV
          fi

          # Hook type
          if [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] || [ "${{ inputs.kernelsu_variant }}" = "ReSukiSU" ]; then
            echo "HOOK_TYPE=SUSFS Inline Hooks" >> $GITHUB_ENV
          else
            echo "HOOK_TYPE=KPROBE Hooks" >> $GITHUB_ENV
          fi

          # Mount type
          if [ "${{ inputs.kernelsu_variant }}" = "Official" ]; then
            echo "MOUNT_TYPE=OVERLAYFS" >> $GITHUB_ENV
          else
            echo "MOUNT_TYPE=Magic Mount" >> $GITHUB_ENV
          fi

          # Release title and KernelSU / SUSFS mode (a later same-named var written to GITHUB_ENV overrides the earlier value)
          case "${{ inputs.ksu_mode }}" in
            "禁用KSU")
              echo "KSU_NAME=not integrated" >> $GITHUB_ENV
              echo "KSU_VER=" >> $GITHUB_ENV
              echo "SUS_VER=not integrated" >> $GITHUB_ENV
              echo "BRANCH_INFO=-" >> $GITHUB_ENV
              echo "HOOK_TYPE=none" >> $GITHUB_ENV
              echo "MOUNT_TYPE=none" >> $GITHUB_ENV
              echo "KPM_STATUS=off" >> $GITHUB_ENV
              echo "RELEASE_HEADLINE=**Pure GKI kernel** (no KernelSU / SUSFS integrated)" >> $GITHUB_ENV
              echo "RELEASE_NAME=GKI Kernel: pure (no KernelSU / SUSFS)" >> $GITHUB_ENV
              ;;
            "禁用SUSFS")
              echo "SUS_VER=not integrated" >> $GITHUB_ENV
              echo "RELEASE_HEADLINE=**${KSU_NAME} ${KSU_VER}** (no SUSFS integrated)" >> $GITHUB_ENV
              echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} (no SUSFS)" >> $GITHUB_ENV
              ;;
            *)
              echo "RELEASE_HEADLINE=**${KSU_NAME} ${KSU_VER}** + **SUSFS ${SUS_VER}**" >> $GITHUB_ENV
              echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} + SUSFS ${SUS_VER}" >> $GITHUB_ENV
              ;;
          esac

      - name: Verify build status
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Selected build job $job_name failed (result: $result)"
              failed=1
            fi
          }
          check_build "${{ inputs.build_a12_5_10 || inputs.build_all }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ inputs.build_a13_5_15 || inputs.build_all }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ inputs.build_a14_6_1 || inputs.build_all }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ inputs.build_a15_6_6 || inputs.build_all }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ inputs.build_a16_6_12 || inputs.build_all }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Determine KSU ref
        if: inputs.ksu_mode != '禁用KSU'
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Official") BRANCH="main" ;;
            "SukiSU")
              if [ "${{ inputs.ksu_mode }}" != "关闭" ]; then
                BRANCH="main"
              else
                BRANCH="builtin"
              fi
              ;;
            "ReSukiSU") BRANCH="main" ;;
            "Next") BRANCH="dev" ;;
            *) echo "Error: unknown variant" >&2; exit 1 ;;
          esac
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "BRANCH_INFO=$BRANCH" >> $GITHUB_ENV

      - name: Get KernelSU commit info
        if: inputs.ksu_mode != '禁用KSU'
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Official") REPO_URL="https://github.com/tiann/KernelSU.git"; REPO_URL2="tiann/KernelSU" ;;
            "Next") REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"; REPO_URL2="KernelSU-Next/KernelSU-Next" ;;
            "SukiSU") REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"; REPO_URL2="SukiSU-Ultra/SukiSU-Ultra" ;;
            "ReSukiSU") REPO_URL="https://github.com/ReSukiSU/ReSukiSU.git"; REPO_URL2="ReSukiSU/ReSukiSU" ;;
          esac

          if [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] && [ -f "config/config" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2)
            CUSTOM_COMMIT=$(grep "^sukisu=" config/config | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" = "true" ] && [ -n "$CUSTOM_COMMIT" ]; then
              KSU_REF="$CUSTOM_COMMIT"
              KSU_URL="https://github.com/$REPO_URL2/commit/$CUSTOM_COMMIT"
              echo "BRANCH_INFO=custom" >> $GITHUB_ENV
            fi
          fi

          if [ -z "${KSU_REF:-}" ]; then
            COMMIT_HASH=$(git ls-remote $REPO_URL refs/heads/${KSU_BRANCH:-main} | awk '{ print $1 }')
            KSU_REF=$COMMIT_HASH
            KSU_URL="https://github.com/$REPO_URL2/commit/$COMMIT_HASH"
          fi

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      - name: Get SUSFS commit info
        if: inputs.ksu_mode == '关闭'
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
            ["gki_android16_6_12"]="gki-android16-6.12"
          )
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      - name: Generate release notes
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            KSU_DISPLAY_REF="${KSU_REF:0:7}"
          else
            KSU_DISPLAY_REF="$KSU_REF"
          fi
          if [[ "${{ inputs.ksu_mode }}" == "禁用KSU" ]]; then
            KSU_COMMIT_LINE="- This build did not integrate KernelSU"
          else
            KSU_COMMIT_LINE="- $KSU_NAME: [\`$KSU_DISPLAY_REF\`]($KSU_URL)"
          fi

          build_targets=""
          append_target() {
            local selected="$1" label="$2"
            if [[ "$selected" == "true" ]]; then
              if [[ -z "$build_targets" ]]; then
                build_targets="$label"
              else
                build_targets="$build_targets, $label"
              fi
            fi
          }
          append_target "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10"
          append_target "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15"
          append_target "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1"
          append_target "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6"
          append_target "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12"
          if [[ -z "$build_targets" ]]; then
            build_targets="none selected"
          fi

          : > susfs_commits.md
          append_susfs_commit() {
            local selected="$1" label="$2" hash="$3" url="$4"
            if [[ "$selected" == "true" && -n "$hash" && -n "$url" ]]; then
              printf -- '- %s: [`%s`](%s)\n' "$label" "${hash:0:7}" "$url" >> susfs_commits.md
            fi
          }
          append_susfs_commit "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10" "${COMMIT_HASH_gki_android12_5_10}" "${COMMIT_URL_gki_android12_5_10}"
          append_susfs_commit "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15" "${COMMIT_HASH_gki_android13_5_15}" "${COMMIT_URL_gki_android13_5_15}"
          append_susfs_commit "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1" "${COMMIT_HASH_gki_android14_6_1}" "${COMMIT_URL_gki_android14_6_1}"
          append_susfs_commit "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6" "${COMMIT_HASH_gki_android15_6_6}" "${COMMIT_URL_gki_android15_6_6}"
          append_susfs_commit "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12" "${COMMIT_HASH_gki_android16_6_12}" "${COMMIT_URL_gki_android16_6_12}"
          if [[ "${{ inputs.ksu_mode }}" != "关闭" ]]; then
            echo "- This build did not integrate SUSFS" > susfs_commits.md
          elif [[ ! -s susfs_commits.md ]]; then
            echo "- No SUSFS commit info obtained for this build" > susfs_commits.md
          fi

          cat > release_body.md << EOF
          ## GKI Kernel Release

          $RELEASE_HEADLINE

          | Item | Content |
          |:---|:---|
          | Release type | ${{ inputs.release_type }} |
          | Release time | $BUILD_DATE |
          | Build scope | $build_targets |

          ### Build config

          | Item | Content |
          |:---|:---|
          | KernelSU / SUSFS mode | ${{ inputs.ksu_mode }} |
          | KernelSU variant | $KSU_NAME |
          | KernelSU branch | $BRANCH_INFO |
          | SUSFS | $SUS_VER |
          | Hook type | $HOOK_TYPE |
          | Mount method | $MOUNT_TYPE |
          | LTO | thin |
          | BBG security patch | $BBG_STATUS |
          | ZRAM / LZ4KD | $LZ4_STATUS |
          | Network enhancements (BBRv3 / IPSet / CAKE / CIFS) | $NET_STATUS |
          | KPM | $KPM_STATUS |

          ### Download notes

          Download the matching files under **Assets** below.

          | File type | Purpose |
          |:---|:---|
          | \`*_kernel-*.zip\` | AnyKernel3 kernel flashable zip |
          | \`*.img\` | boot, vendor_boot and other image files |
          | \`*.apk\` | KernelSU manager |
          | \`susfs-*.zip\` | SUSFS companion module |
          | \`SUSFS-Patches-*.zip\` | SUSFS integration patches (SukiSU / ReSukiSU only, for building your own kernel) |

          > [!IMPORTANT]
          > Back up the stock boot image before flashing.
          > If the device cannot boot, restore the stock image first, then extract KernelSU logs to report back.

          <details>
          <summary>Post-flash steps</summary>

          ### Boots normally

          After installing or updating the KernelSU manager, check that root, modules and SUSFS status are normal.

          ### Cannot boot

          1. Restore the stock boot image
          2. Extract logs using the KernelSU manager or recovery
          3. File it at [Issues](https://github.com/zzh20188/GKI_KernelSU_SUSFS/issues), attaching your device model, Android version, kernel version and flashed file name

          </details>

          <details>
          <summary>Upstream commit info</summary>

          **KernelSU**

          $KSU_COMMIT_LINE

          **SUSFS4KSU**

          $(cat susfs_commits.md)

          </details>

          ---

          Recommended module: https://github.com/sidex15/ksu_module_susfs

          For the Unicode zero-width bypass fix, use the Xposed module: https://t.me/real5ec1cff/268
          EOF

      - name: Generate version tag
        run: |
          # Get the SUSFS version; use the default if get-manager was skipped
          SUS_VERSION="${{ needs.get-manager.outputs.susVer }}"
          if [ -z "$SUS_VERSION" ]; then
            echo "Warning: SUSFS version not obtained, using the default version number"
            SUS_VERSION="1.0.0"
          fi

          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null | sed 's/-.*//' || echo "")

          if [ "$SUS_VERSION" = "$LATEST_TAG" ]; then
            LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          else
            LATEST_TAG="$SUS_VERSION-r0"
          fi

          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated tag: $NEW_TAG"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$NEW_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release_body.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG

      - name: Upload manager and SUSFS module
        continue-on-error: true
        run: |
          echo "Preparing to upload the APK and SUSFS module..."
          apk_count=$(find ./downloaded-artifacts -type f -name "*.apk" | wc -l || true)
          sus_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" | wc -l || true)
          echo "APK files: ${apk_count}"
          echo "SUSFS files: ${sus_count}"
          find ./downloaded-artifacts -type f -name "*.apk" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done

      # Silently skip when a job is skipped or has no artifacts
      - name: Upload SUSFS integration patches
        if: needs.collect-susfs-patches.result == 'success'
        continue-on-error: true
        run: |
          uploaded=0
          for file in ./downloaded-artifacts/SUSFS-Patches-*/SUSFS-Patches-*.zip; do
            [ -f "$file" ] || continue
            echo "Uploading $file..."
            gh release upload "$NEW_TAG" "$file" && uploaded=$((uploaded + 1))
          done
          echo "Uploaded $uploaded SUSFS integration patch zips"

      - name: Upload kernel artifacts
        run: |
          for file in ./downloaded-artifacts/*_kernel-*/*; do
            [ -d "$file" ] && continue
            # Skip files in the -Rejects directory (already aggregated in collect-rejects)
            [[ "$file" == *-Rejects/* ]] && continue
            echo "Uploading $file..."
            gh release upload "$NEW_TAG" "$file"
          done

      - name: Build summary
        run: |
          echo "## Release created" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Link**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY
