name: SUSFS raw-patch probe

# This is an empty shell on the default branch: GitHub only lists workflow_dispatch workflows that exist on the default branch.
# The real probe logic lives on the long-lived tooling branch susfs-probe (same file name); at run time, in the Actions page's
# "Use workflow from", select the susfs-probe branch; this file's inputs must stay in sync with the tooling branch.
# Running it directly on dev only prints a notice and builds nothing.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version (all = all branches)"
        required: true
        type: choice
        options:
          - all
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: all
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - SukiSU
          - ReSukiSU
          - Official
        default: SukiSU
      sub_level_min:
        description: "Minimum sublevel (empty = no limit)"
        required: false
        type: string
        default: ""
      sub_level_max:
        description: "Maximum sublevel (empty = no limit)"
        required: false
        type: string
        default: ""
      os_patch_levels:
        description: "Probe only these security-patch months, comma-separated (empty = no limit, e.g. 2025-03,2025-07)"
        required: false
        type: string
        default: ""
      include_lts:
        description: "Also probe the LTS branch"
        required: false
        type: boolean
        default: true
      susfs_side_fixes:
        description: "Keep the sublevel-independent SUSFS-side fixes (two compile defects in the 5.10 upstream patch itself)"
        required: false
        type: boolean
        default: false
      susfs_pin_time:
        description: "Pin susfs4ksu to the last commit before this instant (ISO 8601, empty = this run's start time)"
        required: false
        type: string
        default: ""
      upload_kernels:
        description: "Upload the compiled AnyKernel3 package (by default only the probe conclusion is kept)"
        required: false
        type: boolean
        default: false
      max_parallel:
        description: "Maximum number of parallel jobs"
        required: false
        type: string
        default: "20"
      data_source:
        description: "Source branch for the version data and existing probe results"
        required: false
        type: string
        default: dev

jobs:
  notice:
    name: Please select the susfs-probe branch to run
    runs-on: ubuntu-24.04
    steps:
      - name: Notice
        run: |
          echo "::error::This is an empty shell workflow on dev; it builds nothing."
          echo "::error::In Run workflow's 'Use workflow from', select the susfs-probe branch before running."
          exit 1
