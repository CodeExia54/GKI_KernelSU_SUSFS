# ========================================
# 在线 init_boot / boot 打补丁 (LKM)
# ========================================
# 通过临时 Release 传输镜像：
#   页面创建 Release -> 上传原始镜像为附件 -> 触发本工作流
#   -> 用 ReSukiSU 预编译 ksud (QEMU 运行, 内置 ksuinit) + 对应 KMI 的
#      kernelsu.ko 给镜像打补丁 -> 把补丁后的镜像作为附件传回同一个 Release
#   -> 页面轮询到补丁附件后给出下载链接。
# 说明：ksud 只处理镜像文件，不刷机；失败只会让本次运行失败，
#      不会产出损坏镜像。仓库不会因此膨胀（镜像走 Release，不进 git）。
# ========================================

name: 在线打补丁 (init_boot LKM)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "临时 Release tag（页面自动生成，附带原始镜像）"
        required: true
        type: string
      asset_name:
        description: "原始镜像附件名"
        required: true
        type: string
        default: "input-init_boot.img"
      kmi:
        description: "KMI 版本"
        required: true
        type: choice
        default: android13-5.15
        options:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
      variant:
        description: "Root 变体 (ksud 来源)"
        required: true
        type: choice
        default: ReSukiSU
        options:
          - ReSukiSU
          - SukiSU-Ultra
          - KernelSU
          - KernelSU-Next
      ksud_release:
        description: "ksud release tag（留空=各变体 latest）"
        required: false
        type: string
        default: ""

jobs:
  patch:
    name: "Patch ${{ inputs.asset_name }} · ${{ inputs.kmi }} · ${{ inputs.variant }}"
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库 (取 lkm/ 资源)
        uses: actions/checkout@v7
        with:
          path: self

      - name: 解析变体源
        id: v
        run: |
          case "${{ inputs.variant }}" in
            "ReSukiSU")      echo "repo=ReSukiSU/ReSukiSU" >> "$GITHUB_OUTPUT"; echo "ref=main" >> "$GITHUB_OUTPUT" ;;
            "SukiSU-Ultra")  echo "repo=SukiSU-Ultra/SukiSU-Ultra" >> "$GITHUB_OUTPUT"; echo "ref=main" >> "$GITHUB_OUTPUT" ;;
            "KernelSU")      echo "repo=tiann/KernelSU" >> "$GITHUB_OUTPUT"; echo "ref=main" >> "$GITHUB_OUTPUT" ;;
            "KernelSU-Next") echo "repo=KernelSU-Next/KernelSU-Next" >> "$GITHUB_OUTPUT"; echo "ref=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown variant"; exit 1 ;;
          esac

      - name: 检出变体源码 (ksud)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.v.outputs.repo }}
          ref: ${{ steps.v.outputs.ref }}
          path: src

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm curl jq

      - name: 安装 Rust (nightly, ksud 需要 feature flags)
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustc --version

      - name: 缓存 cargo 构建
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/userspace/ksud/target
          key: ksud-host-${{ inputs.variant }}-${{ hashFiles('src/userspace/ksud/Cargo.lock') }}
          restore-keys: ksud-host-${{ inputs.variant }}-

      - name: 编译 ksud (本机 x86_64 原生, 无需 bionic/QEMU)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd src/userspace/ksud
          # build.rs 需要 NDK clang 汇编 aarch64 bootstrap；runner 自带 NDK
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          cargo build --release --bin ksud
          ls -la target/release/ksud
          ./target/release/ksud --version || true

      - name: 下载原始镜像 (来自临时 Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download "${{ inputs.release_tag }}" \
            -R "${{ github.repository }}" \
            -p "${{ inputs.asset_name }}" -D work
          MAGIC=$(head -c 8 "work/${{ inputs.asset_name }}")
          echo "magic: $MAGIC"
          if [ "$MAGIC" != "ANDROID!" ]; then
            echo "::error::上传的文件不是 Android boot/init_boot 镜像 (缺少 ANDROID! 魔数)"
            exit 1
          fi

      - name: 准备 kernelsu.ko 与 ksuinit
        run: |
          KO="self/lkm/${{ inputs.kmi }}_kernelsu.ko"
          INIT="self/lkm/ksuinit-aarch64"
          if [ ! -f "$KO" ]; then
            echo "::error::仓库缺少 $KO —— 请先用 '构建 LKM' 工作流生成该 KMI 的 .ko 放到 lkm/"
            exit 1
          fi
          if [ ! -f "$INIT" ]; then
            echo "::error::仓库缺少 $INIT (ksuinit)"
            exit 1
          fi
          cp "$KO" work/kernelsu.ko
          cp "$INIT" work/ksuinit
          ls -la work

      - name: 执行 boot-patch (原生)
        id: patch
        run: |
          cd work
          set +e
          ../src/userspace/ksud/target/release/ksud boot-patch \
            -b "${{ inputs.asset_name }}" \
            -m kernelsu.ko \
            -i ksuinit \
            --arch aarch64 \
            --kmi "${{ inputs.kmi }}" \
            -o out --out-name "patched-${{ inputs.kmi }}-${{ inputs.asset_name }}" 2>&1 | tee patch.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "ksud rc=$RC"
          ls -la out 2>/dev/null || true
          OUT=$(ls out/patched-*.img 2>/dev/null | head -1 || true)
          if [ -z "$OUT" ] || [ "$RC" -ne 0 ]; then
            echo "::error::打补丁失败 (rc=$RC)。日志见 patch.log 附件。"
            exit 1
          fi
          if [ "$(head -c 8 "$OUT")" != "ANDROID!" ]; then
            echo "::error::输出不是有效的 Android 镜像"
            exit 1
          fi
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传补丁镜像到 Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "work/${{ steps.patch.outputs.out }}" \
            -R "${{ github.repository }}" --clobber

      - name: 上传日志 (失败时排查用)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patch-log-${{ inputs.kmi }}
          path: work/patch.log
          if-no-files-found: ignore
