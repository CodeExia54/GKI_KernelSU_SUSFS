# ========================================
# Online init_boot / boot patching (LKM)
# ========================================
# Transfer the image via a temporary Release:
#   page creates a Release -> uploads the raw image as an attachment -> triggers this workflow
#   -> uses ReSukiSU's prebuilt ksud (run under QEMU, with built-in ksuinit) + the matching KMI's
#      kernelsu.ko to patch the image -> uploads the patched image back as an attachment on the same Release
#   -> once the page polls and sees the patched attachment, it offers a download link.
# Note: ksud only processes image files, it does not flash; a failure only fails this run,
#      it will not produce a corrupted image. The repo does not bloat from this (images go via Release, not git).
# ========================================

name: Online patching (init_boot LKM)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Temporary Release tag (auto-generated by the page, with the raw image attached)"
        required: true
        type: string
      asset_name:
        description: "Raw image attachment name"
        required: true
        type: string
        default: "input-init_boot.img"
      kmi:
        description: "KMI version"
        required: true
        type: choice
        default: android13-5.15
        options:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
      variant:
        description: "Root variant (ksud source)"
        required: true
        type: choice
        default: ReSukiSU
        options:
          - ReSukiSU
          - SukiSU-Ultra
          - KernelSU
          - KernelSU-Next
      ksud_release:
        description: "ksud release tag (empty = latest for each variant)"
        required: false
        type: string
        default: ""

jobs:
  patch:
    name: "Patch ${{ inputs.asset_name }} · ${{ inputs.kmi }} · ${{ inputs.variant }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (for lkm/ resources)
        uses: actions/checkout@v7
        with:
          path: self

      - name: Resolve the variant source
        id: v
        run: |
          case "${{ inputs.variant }}" in
            "ReSukiSU")      echo "repo=ReSukiSU/ReSukiSU" >> "$GITHUB_OUTPUT"; echo "ref=main" >> "$GITHUB_OUTPUT" ;;
            "SukiSU-Ultra")  echo "repo=SukiSU-Ultra/SukiSU-Ultra" >> "$GITHUB_OUTPUT"; echo "ref=main" >> "$GITHUB_OUTPUT" ;;
            "KernelSU")      echo "repo=tiann/KernelSU" >> "$GITHUB_OUTPUT"; echo "ref=main" >> "$GITHUB_OUTPUT" ;;
            "KernelSU-Next") echo "repo=KernelSU-Next/KernelSU-Next" >> "$GITHUB_OUTPUT"; echo "ref=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown variant"; exit 1 ;;
          esac

      - name: Checkout the variant source (ksud)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.v.outputs.repo }}
          ref: ${{ steps.v.outputs.ref }}
          path: src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm curl jq

      - name: Install Rust (nightly, ksud needs feature flags)
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustc --version

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/userspace/ksud/target
          key: ksud-host-${{ inputs.variant }}-${{ hashFiles('src/userspace/ksud/Cargo.lock') }}
          restore-keys: ksud-host-${{ inputs.variant }}-

      - name: Compile ksud (native x86_64, no bionic/QEMU needed)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd src/userspace/ksud
          # build.rs needs NDK clang to assemble the aarch64 bootstrap; the runner ships NDK
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          cargo build --release --bin ksud
          ls -la target/release/ksud
          ./target/release/ksud --version || true

      - name: Download the raw image (from the temporary Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download "${{ inputs.release_tag }}" \
            -R "${{ github.repository }}" \
            -p "${{ inputs.asset_name }}" -D work
          MAGIC=$(head -c 8 "work/${{ inputs.asset_name }}")
          echo "magic: $MAGIC"
          if [ "$MAGIC" != "ANDROID!" ]; then
            echo "::error::The uploaded file is not an Android boot/init_boot image (missing ANDROID! magic)"
            exit 1
          fi

      - name: Prepare kernelsu.ko and ksuinit
        run: |
          KO="self/lkm/${{ inputs.kmi }}_kernelsu.ko"
          INIT="self/lkm/ksuinit-aarch64"
          if [ ! -f "$KO" ]; then
            echo "::error::Repo is missing $KO — generate the .ko for this KMI with the 'Build LKM' workflow and put it in lkm/"
            exit 1
          fi
          if [ ! -f "$INIT" ]; then
            echo "::error::Repo is missing $INIT (ksuinit)"
            exit 1
          fi
          cp "$KO" work/kernelsu.ko
          cp "$INIT" work/ksuinit
          ls -la work

      - name: Run boot-patch (native)
        id: patch
        run: |
          cd work
          mkdir -p out
          set +e
          ../src/userspace/ksud/target/release/ksud boot-patch \
            -b "${{ inputs.asset_name }}" \
            -m kernelsu.ko \
            -i ksuinit \
            --arch aarch64 \
            --kmi "${{ inputs.kmi }}" \
            -o out --out-name "patched-${{ inputs.kmi }}-${{ inputs.asset_name }}" 2>&1 | tee patch.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "ksud rc=$RC"
          ls -la out 2>/dev/null || true
          OUT=$(ls out/patched-*.img 2>/dev/null | head -1 || true)
          if [ -z "$OUT" ] || [ "$RC" -ne 0 ]; then
            echo "::error::Patching failed (rc=$RC). See the patch.log attachment for the log."
            exit 1
          fi
          if [ "$(head -c 8 "$OUT")" != "ANDROID!" ]; then
            echo "::error::Output is not a valid Android image"
            exit 1
          fi
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload the patched image to the Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "work/${{ steps.patch.outputs.out }}" \
            -R "${{ github.repository }}" --clobber

      - name: Upload logs (for troubleshooting on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patch-log-${{ inputs.kmi }}
          path: work/patch.log
          if-no-files-found: ignore
