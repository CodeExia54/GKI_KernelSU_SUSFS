name: GetManager
permissions:
  contents: write
  actions: read

on:
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-24.04
    outputs:
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.caller_repository }}"
          echo "  - Caller Workflow:   ${{ github.caller_workflow }}"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq

      - name: Get KSU & SUSFS versions
        id: get_version
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "This is the Next variant"
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            echo "This is the SukiSU(40726) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 5da529942987b834c2b02a4819eaa298a8383bf4
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            echo "This is the SukiSU(40548) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 3170a48c508f6330ea636c51835a84573fe56ef5
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            echo "This is the ReSukiSU variant"
            git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "This is the Official"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            KSU_VERSION=40726
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            KSU_VERSION=40548
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            KSU_VERSION=$((20000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            SUS_VERSION="v2.1.0"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            SUS_VERSION="v2.0.0"
          else
            INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
            SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          fi
          echo $SUS_VERSION

          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: Add KernelSU
        id: add_KSU
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Robust GitHub API fetch: retry + validate JSON; error responses fail immediately,
          # to avoid treating {"message":...}/rate-limit responses as "0 builds" and silently publishing an empty release without the manager.
          # Optional: set GH_PAT (with actions:read) in repo Secrets for more reliable cross-repo artifact read/download; falls back to GITHUB_TOKEN by default.
          API_TOKEN="${GH_PAT:-${GH_TOKEN:-}}"
          GH_HDRS=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          [ -n "$API_TOKEN" ] && GH_HDRS+=(-H "Authorization: token $API_TOKEN")
          gh_json() {
            local url="$1" attempt out http body
            for attempt in 1 2 3 4 5; do
              # --location is required: after the upstream repo rename, api.github.com returns 301 for old paths (redirecting to /repositories/<id>/...),
              # not following it yields a 301 response with no .workflow_runs — exactly the root cause of the earlier silent empty release.
              if out=$(curl -sS --location --max-redirs 5 "${GH_HDRS[@]}" -w $'\n%{http_code}' "$url" 2>/dev/null); then
                http=$(printf '%s' "$out" | tail -n1)
                body=$(printf '%s' "$out" | sed '$d')
                if [ "$http" = "200" ] && printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
                  printf '%s' "$body"; return 0
                fi
                echo "::warning::GitHub API $url returned HTTP ${http} (attempt ${attempt}), retrying..." >&2
              else
                echo "::warning::GitHub API $url connection failed (attempt ${attempt}), retrying..." >&2
              fi
              sleep $((attempt * 3))
            done
            echo "::error::GitHub API still failing after multiple retries: $url" >&2
            return 1
          }

          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_DIR="SukiSU_40726" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_DIR="SukiSU_40548" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "Downloading ${{ inputs.kernelsu_variant }} manager..."
            mkdir -p "manager-artifacts/$LEGACY_DIR"
            MANAGER_URL=$(curl -fsSL "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/releases/tags/$LEGACY_RELEASE_TAG" |
              jq -r '.assets[] | select(.name | startswith("SukiSU_") and endswith("-release.apk")) | .browser_download_url' |
              head -n 1)
            if [ -z "$MANAGER_URL" ]; then
              echo "No download URL found for the ${{ inputs.kernelsu_variant }} manager."
              exit 1
            fi
            curl -fL -o "manager-artifacts/$LEGACY_DIR/${LEGACY_DIR}-release.apk" "$MANAGER_URL"
            exit 0
          fi

          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "KernelSU Next..."
            REPO="KernelSU-Next/KernelSU-Next"
            KSUM="manager"
            BRANCH="dev"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            echo "ReSukiSU..."
            REPO="ReSukiSU/ReSukiSU"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "KSU..."
            REPO="tiann/KernelSU"
            KSUM="manager"
          fi

          FILENAME=$([[ "${{ inputs.kernelsu_variant }}" == "Next" ]] && echo "build-manager-ci.yml" || echo "build-manager.yml")


          # Select the Manager by the kernel's KSU version, to avoid the APK version being ahead of the kernel version
          TARGET_KSU_VERSION="${KSU_VERSION:-}"
          if ! [[ "$TARGET_KSU_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Invalid target KSU version: $TARGET_KSU_VERSION"
            exit 1
          fi

          calculate_run_ksu_version() {
            local head_sha="$1"
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              git -C KernelSU fetch --no-tags origin "$head_sha" >/dev/null 2>&1 || true
            fi
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              return 1
            fi

            local git_version
            git_version=$(git -C KernelSU rev-list --count "$head_sha")
            case "${{ inputs.kernelsu_variant }}" in
              "SukiSU") echo $((40000 + git_version - 2815)) ;;
              "ReSukiSU") echo $((30700 + git_version)) ;;
              "Official") echo $((20000 + git_version)) ;;
              "Next") echo $((30000 + git_version)) ;;
              *) return 1 ;;
            esac
          }

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
              printf '%s' "$artifacts" | jq -r --arg name "$KSUM" \
                '.artifacts[] | select(.name == $name) | "\(.name)\t\(.archive_download_url)"'
            elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
              printf '%s' "$artifacts" | jq -r \
                '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release") | "\(.name)\t\(.archive_download_url)"'
            else
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" \
                '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          DOWNLOAD_LIST=""
          BEST_VERSION=0
          BEST_BUILD_ID=""
          BEST_BRANCH=""
          RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&per_page=30"
          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?branch=$BRANCH&status=success&per_page=30"
          elif [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            # Only take push builds on the main branch: without the filter it would pick a Manager from a PR / feature branch (e.g. renovate/*, fix-execve),
            # while the kernel is main. Must also restrict event=push, otherwise a fork's main-branch PR would slip in too.
            RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?branch=main&event=push&status=success&per_page=30"
          fi

          echo "Searching for a Manager artifact not newer than KSU $TARGET_KSU_VERSION..."
          for PAGE in $(seq 1 10); do
            echo "--------------------------------------------------"
            echo "Checking build history page ${PAGE}..."
            if ! RUNS=$(gh_json "$RUNS_URL&page=$PAGE"); then
              echo "::error::Cannot fetch the build list for $REPO (page $PAGE). Aborting to avoid publishing a release without the manager."
              exit 1
            fi
            # Must be an array; an error object must not be treated as "0 builds" and silently skipped (exactly the earlier silent failure).
            if [ "$(printf '%s' "$RUNS" | jq -r '.workflow_runs | type')" != "array" ]; then
              echo "::error::Unexpected build-list response (.workflow_runs is not an array): $(printf '%s' "$RUNS" | head -c 300)"
              exit 1
            fi
            RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
            if [ "$RUN_COUNT" -eq 0 ]; then
              if [ "$PAGE" -eq 1 ]; then
                echo "::error::$REPO has no successful builds of $FILENAME after filtering (check branch/event filters and token permissions)."
                exit 1
              fi
              break
            fi

            for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
              BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
              HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
              HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")

              RUN_KSU_VERSION=$(calculate_run_ksu_version "$HEAD_SHA" || true)
              if ! [[ "$RUN_KSU_VERSION" =~ ^[0-9]+$ ]]; then
                echo "Skipping build $BUILD_ID: cannot compute KSU version from commit $HEAD_SHA"
                continue
              fi
              if [ "$RUN_KSU_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
                echo "Skipping build $BUILD_ID ($HEAD_BRANCH): Manager KSU $RUN_KSU_VERSION is higher than kernel KSU $TARGET_KSU_VERSION"
                continue
              fi

              if ! ARTIFACTS=$(gh_json "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts?per_page=100"); then
                echo "Skipping build $BUILD_ID: cannot fetch artifact list"
                continue
              fi
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -z "$CANDIDATE_LIST" ]; then
                echo "Skipping build $BUILD_ID ($HEAD_BRANCH): no artifact containing '$KSUM' found"
                continue
              fi

              if [ -z "$DOWNLOAD_LIST" ] || [ "$RUN_KSU_VERSION" -gt "$BEST_VERSION" ]; then
                DOWNLOAD_LIST="$CANDIDATE_LIST"
                BEST_VERSION="$RUN_KSU_VERSION"
                BEST_BUILD_ID="$BUILD_ID"
                BEST_BRANCH="$HEAD_BRANCH"
                echo "Candidate Manager: build $BUILD_ID ($HEAD_BRANCH), KSU $RUN_KSU_VERSION"
              fi

              if [ "$RUN_KSU_VERSION" -eq "$TARGET_KSU_VERSION" ]; then
                break 2
              fi
            done
          done

          if [ -z "$DOWNLOAD_LIST" ]; then
            echo "No Manager artifact download URL found with KSU version <= $TARGET_KSU_VERSION."
            exit 1
          fi
          echo "Selected Manager build $BEST_BUILD_ID ($BEST_BRANCH), KSU $BEST_VERSION"

          # Note: use a here-string, not a pipe, so the while loop does not run in a subshell and a download failure's exit 1 can abort this step.
          while IFS=$'\t' read -r NAME URL; do
            [ -z "$NAME" ] && continue
            SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
            ZIP_NAME="${{ inputs.kernelsu_variant }}-${SAFE_NAME}(${{ env.KSU_VERSION }}).zip"
            echo "Downloading $NAME -> $ZIP_NAME"
            if ! curl -sS --fail-with-body --location --retry 3 --retry-all-errors \
                 --retry-delay 2 --connect-timeout 15 --max-time 300 \
                 "${GH_HDRS[@]}" -o "$ZIP_NAME" "$URL"; then
              echo "::error::Failed to download Manager artifact: $NAME. If this is a cross-repo 403, configure a GH_PAT with actions:read in Secrets."
              exit 1
            fi
            if ! unzip -tq "$ZIP_NAME" >/dev/null 2>&1; then
              echo "::error::Downloaded artifact is not a valid zip (possibly an error response): $NAME"
              head -c 300 "$ZIP_NAME" || true
              exit 1
            fi
            mkdir -p "manager-artifacts/$SAFE_NAME"
            unzip -o "$ZIP_NAME" -d "manager-artifacts/$SAFE_NAME"
            rm -rf "$ZIP_NAME"
          done <<< "$DOWNLOAD_LIST"

          if [ "${{ inputs.kernelsu_variant }}" == "ReSukiSU" ]; then
            echo "Keeping only the ReSukiSU arm64-v8a release manager..."
            find manager-artifacts -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" -delete
            find manager-artifacts -type f -name "*debug*.apk" -delete
            if ! find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | grep -q .; then
              echo "No ReSukiSU arm64-v8a release manager found."
              exit 1
            fi
            find manager-artifacts -type f -name "*.apk" -print
          fi

      - name: Add SUSFS module
        id: add_SUSFS
        continue-on-error: true
        run: |
          set -euo pipefail

          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_SUSFS_VERSION="v2.1.0" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_SUSFS_VERSION="v2.0.0" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "Downloading the SUSFS module for ${{ inputs.kernelsu_variant }}..."
            mkdir -p susfs-module
            curl -fL -o susfs-module/ksu_module_susfs.zip \
              "https://github.com/zzh20188/GKI_KernelSU_SUSFS/releases/download/$LEGACY_RELEASE_TAG/ksu_module_susfs.zip"
            echo "SUSFS_NAME=$LEGACY_SUSFS_VERSION" >> "$GITHUB_ENV"
            exit 0
          fi

          API_ROOT="https://api.github.com/repos/sidex15/susfs4ksu-module"
          CURL_ARGS=(--fail-with-body --silent --show-error --location
            --retry 3 --retry-all-errors --retry-delay 2
            --connect-timeout 15 --max-time 120)
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          # Write the response to a file first, to avoid concatenating multiple responses into invalid JSON on retry.
          github_api() {
            : > "$WORKDIR/api.json"
            if ! curl "${CURL_ARGS[@]}" -H "Authorization: Bearer $GH_TOKEN" \
              -o "$WORKDIR/api.json" "$1"; then
              echo "::error::GitHub API request still failing after retries: $1" >&2
              if [ -s "$WORKDIR/api.json" ]; then
                cat "$WORKDIR/api.json" >&2
              fi
              return 1
            fi
            cat "$WORKDIR/api.json"
          }

          RUNS=$(github_api "$API_ROOT/actions/workflows/build.yml/runs?status=success&per_page=30")
          if ! BUILD_IDS=$(jq -er '
            .workflow_runs | if type != "array" then error("build list is not an array")
            else .[] | .id | select(type == "number" and . > 0 and . == floor) end
          ' <<< "$RUNS"); then
            echo "::error::SUSFS build list is invalid or has no successful builds" >&2
            exit 1
          fi

          DOWNLOAD_URL=""
          NAME=""
          while IFS= read -r BUILD_ID; do
            ARTIFACTS=$(github_api "$API_ROOT/actions/runs/$BUILD_ID/artifacts?per_page=100")
            if ! CANDIDATE=$(jq -c --arg prefix "$API_ROOT/actions/artifacts/" '
              if (.artifacts | type) != "array" then error("artifact list is not an array")
              else [.artifacts[]
                | select(.expired == false)
                | select(.name | strings | test("^[^\\r\\n]+$"))
                | select(.archive_download_url | strings | startswith($prefix))
                | select(.archive_download_url | ltrimstr($prefix) | test("^[1-9][0-9]*/zip$"))
              ][0] // empty end
            ' <<< "$ARTIFACTS"); then
              echo "::error::Artifact list for SUSFS build $BUILD_ID is invalid" >&2
              exit 1
            fi
            if [ -z "$CANDIDATE" ]; then
              echo "::warning::SUSFS build $BUILD_ID has no usable artifacts, continuing to check build history"
              continue
            fi
            NAME=$(jq -r '.name' <<< "$CANDIDATE")
            DOWNLOAD_URL=$(jq -r '.archive_download_url' <<< "$CANDIDATE")
            echo "Selected SUSFS module: build $BUILD_ID, artifact $NAME"
            break
          done <<< "$BUILD_IDS"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::None of the last 30 successful builds has an unexpired SUSFS module artifact with a valid download URL" >&2
            exit 1
          fi

          curl "${CURL_ARGS[@]}" -H "Authorization: Bearer $GH_TOKEN" \
            -o "$WORKDIR/artifact.zip" "$DOWNLOAD_URL"
          unzip -q "$WORKDIR/artifact.zip" -d "$WORKDIR/extracted"

          mkdir -p "$WORKDIR/module"
          shopt -s nullglob
          MODULE_ZIPS=("$WORKDIR/extracted/"*.zip)
          if [ "${#MODULE_ZIPS[@]}" -gt 0 ]; then
            cp -- "${MODULE_ZIPS[@]}" "$WORKDIR/module/"
          else
            (cd "$WORKDIR/extracted" && zip -qr "$WORKDIR/module/ksu_module_susfs.zip" .)
          fi

          # Replace the output directory only after success, so repeated runs do not leave old modules or incomplete downloads.
          rm -rf susfs-module
          mv "$WORKDIR/module" susfs-module
          echo "SUSFS_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SUSFS module downloaded and organized"

      - name: Report SUSFS module download failure
        if: steps.add_SUSFS.outcome == 'failure'
        run: echo "::warning::SUSFS module download failed; no module ZIP this time; does not affect the Manager APK or the kernel build."

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "Failed to download the CI-built KSU!"

      - name: Upload APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.KSU_VERSION }})
          path: |
            manager-artifacts/**/*.apk

      - name: Upload SUSFS module
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
